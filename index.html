<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7b9cb" />
  <title>¿Ya te levantaste, chambeadora?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="tarjeta" id="tarjeta">
    <span class="cinta" aria-hidden="true"></span>

    <div class="foto" data-emoji="🌷">
      <img id="imagen" src="assets/images/gatito.jpg" alt="" />
    </div>

    <h1 class="pregunta" id="pregunta">¿Ya te levantaste, chambeadora?</h1>
    <p class="texto" id="texto"></p>

    <div class="opciones" id="opciones">
      <button class="boton si" id="btnSi" type="button">Sí</button>
      <button class="boton no" id="btnNo" type="button">No</button>
    </div>
  </main>

  <audio id="musica" loop preload="auto" playsinline>
    <source src="sounds/musicMonLaferte.mp3" type="audio/mpeg" />
  </audio>

  <script src="scripts/app.js"></script>
</body>
</html>
